appId: com.termforge.desktop
productName: TermForge
copyright: Copyright © 2026 TermForge

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - "!**/*.map"
  - "!node_modules/zod/src/**"
  - "!node_modules/**/{test,tests,__tests__}/**"
  - "!node_modules/**/*.test.*"
  - "!node_modules/**/*.spec.*"

asar: true
removePackageScripts: true

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  executableName: TermForge
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: true
  artifactName: ${productName} Setup ${version}.${ext}

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: TermForge
  uninstallDisplayName: TermForge ${version}
  artifactName: ${productName} Setup ${version}.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  language: "2052"
  installerLanguages:
    - zh_CN
    - en_US
